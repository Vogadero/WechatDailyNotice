# daily-message.yml
name: Daily Message Sender

on:
  schedule:
    # 每天北京时间7:30运行 (UTC 23:15) - 避开整点高峰
    - cron: '15 23 * * *'
    # 每天北京时间11:00运行 (UTC 01:00) - 延时任务1
    - cron: '0 1 * * *'
    # 每天北京时间17:00运行 (UTC 08:20) - 延时任务2
    - cron: '20 8 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要这个权限来推送更改
      actions: read
      checks: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'

    - name: Install dependencies
      run: |
        # 使用 npm 安装依赖（统一包管理器）
        npm ci
        npm install -g json

    # 环境变量测试步骤
    - name: Test environment variables
      env:
        WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
        HEFENG_API_HOST: ${{ secrets.HEFENG_API_HOST }}
        HEFENG_KEY_ID: ${{ secrets.HEFENG_KEY_ID }}
        HEFENG_PROJECT_ID: ${{ secrets.HEFENG_PROJECT_ID }}
        HEFENG_PRIVATE_KEY: ${{ secrets.HEFENG_PRIVATE_KEY }}
        TANSHU_API_KEY: ${{ secrets.TANSHU_API_KEY }}
      run: |
        echo "=== 测试环境变量 ==="
        echo ""
        
        # 检查环境变量是否设置
        all_set=true
        
        if [ -n "$WXPUSHER_APP_TOKEN" ]; then
          echo "✅ WXPUSHER_APP_TOKEN: 已设置"
        else
          echo "❌ WXPUSHER_APP_TOKEN: 未设置"
          all_set=false
        fi

        if [ -n "$TANSHU_API_KEY" ]; then
          echo "✅ TANSHU_API_KEY: 已设置"
          echo "   值: $TANSHU_API_KEY"
        else
          echo "❌ TANSHU_API_KEY: 未设置"
          all_set=false
        fi
        
        if [ -n "$HEFENG_API_HOST" ]; then
          echo "✅ HEFENG_API_HOST: 已设置"
          echo "   值: $HEFENG_API_HOST"
        else
          echo "❌ HEFENG_API_HOST: 未设置"
          all_set=false
        fi
        
        if [ -n "$HEFENG_KEY_ID" ]; then
          echo "✅ HEFENG_KEY_ID: 已设置"
        else
          echo "❌ HEFENG_KEY_ID: 未设置"
          all_set=false
        fi
        
        if [ -n "$HEFENG_PROJECT_ID" ]; then
          echo "✅ HEFENG_PROJECT_ID: 已设置"
        else
          echo "❌ HEFENG_PROJECT_ID: 未设置"
          all_set=false
        fi
        
        if [ -n "$HEFENG_PRIVATE_KEY" ]; then
          echo "✅ HEFENG_PRIVATE_KEY: 已设置"
          echo "   长度: ${#HEFENG_PRIVATE_KEY}"
        else
          echo "❌ HEFENG_PRIVATE_KEY: 未设置"
          all_set=false
        fi
        
        echo ""
        if [ "$all_set" = true ]; then
          echo "✅ 所有环境变量都已设置"
        else
          echo "❌ 部分环境变量未设置"
          echo "请检查 GitHub Secrets 是否已正确设置"
          exit 1
        fi

    - name: Run daily message script
      env:
        # 在这里传递所有必需的环境变量
        WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
        HEFENG_API_HOST: ${{ secrets.HEFENG_API_HOST }}
        HEFENG_KEY_ID: ${{ secrets.HEFENG_KEY_ID }}
        HEFENG_PROJECT_ID: ${{ secrets.HEFENG_PROJECT_ID }}
        HEFENG_PRIVATE_KEY: ${{ secrets.HEFENG_PRIVATE_KEY }}
        TANSHU_API_KEY: ${{ secrets.TANSHU_API_KEY }}
        # 判断是否是定时触发
        IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
      run: |
        echo "=== 运行主脚本 ==="
        echo "传递的环境变量:"
        echo "WXPUSHER_APP_TOKEN 长度: ${#WXPUSHER_APP_TOKEN}"
        echo "HEFENG_API_HOST: $HEFENG_API_HOST"
        echo "HEFENG_KEY_ID: $HEFENG_KEY_ID"
        echo "HEFENG_PROJECT_ID: $HEFENG_PROJECT_ID"
        echo "HEFENG_PRIVATE_KEY 长度: ${#HEFENG_PRIVATE_KEY}"
        echo "IS_SCHEDULED: $IS_SCHEDULED"
        echo "TANSHU_API_KEY: $TANSHU_API_KEY"
        
        # 运行脚本
        node scripts/send-message.js $IS_SCHEDULED

    # 提交 data 文件夹的变更到 Git
    - name: Commit and push data files
      if: always()
      env:
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        echo "📦 检查 data 文件夹是否有变更..."
        
        # 检查是否有文件变更
        if git status --porcelain data/ | grep -q .; then
          echo "🔄 检测到 data 文件夹有变更，提交到 Git..."
          
          # 配置 Git 用户信息
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 设置远程 URL 使用 token
          git remote set-url origin https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}
          
          # 添加变更的文件
          git add data/
          
          # 创建提交信息
          if [ "${{ github.event_name }}" = "schedule" ]; then
            COMMIT_MSG="chore: update data files [自动定时更新]"
          else
            COMMIT_MSG="chore: update data files [手动触发更新]"
          fi
          
          # 提交
          git commit -m "$COMMIT_MSG" || echo "提交失败或无变更"
          
          # 推送
          echo "🚀 推送变更到仓库..."
          git push origin HEAD:${{ github.ref }} || echo "推送失败"
          
          echo "✅ data 文件夹变更尝试提交完成"
        else
          echo "✅ data 文件夹无变更，无需提交"
        fi